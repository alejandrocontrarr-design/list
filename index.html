<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lista de Tareas - Ejemplo con Bootstrap</title>

  <!-- Enlace a Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- ✅ Estilos personalizados para tareas completadas -->
  <style>
    .completed {
      text-decoration: line-through;
      color: #198754; /* Verde Bootstrap */
    }
  </style>
</head>
<body class="bg-light">

  <div class="container py-5">
    <h1 class="text-center mb-4">📋 Lista de Tareas</h1>

    <!-- Tarjeta principal -->
    <div class="card shadow-sm">
      <div class="card-body">

        <!-- Formulario -->
        <div id="form" class="d-flex gap-2 mb-3">
          <input
            id="taskInput"
            type="text"
            class="form-control"
            placeholder="Escribe una tarea y presiona Agregar"
          />
          <button id="addBtn" class="btn btn-primary">Agregar</button>
        </div>

        <!-- Lista de tareas -->
        <ul id="tasksList" class="list-group">
          <li class="list-group-item text-muted text-center">
            No hay tareas aún.
          </li>
        </ul>
      </div>
    </div>
  </div>

  <!-- Enlace a Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Enlace al archivo de JavaScript -->
  <script src="js/app_simple.js"></script>
</body>
</html>
